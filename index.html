<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mercury Bird</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #70c5ce; font-family: 'Arial', sans-serif; }
        canvas { display: block; }
        #score { position: absolute; top: 20px; width: 100%; text-align: center; color: white; font-size: 40px; font-weight: bold; text-shadow: 2px 2px 5px rgba(0,0,0,0.5); pointer-events: none; }
    </style>
</head>
<body>
    <div id="score">0</div>
    <canvas id="game"></canvas>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let bird = { x: 50, y: 150, w: 34, h: 24, gravity: 0.6, velocity: 0, jump: -8 };
        let pipes = [];
        let gap = 150;
        let pipeWidth = 50;
        let score = 0;
        let frames = 0;
        let gameActive = true;

        function drawBird() {
            ctx.fillStyle = "#f1c40f";
            ctx.fillRect(bird.x, bird.y, bird.w, bird.h);
        }

        function createPipe() {
            let topHeight = Math.random() * (canvas.height - gap - 100) + 50;
            pipes.push({ x: canvas.width, top: topHeight, bottom: canvas.height - topHeight - gap });
        }

        function update() {
            if (!gameActive) return;

            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            if (frames % 90 === 0) createPipe();

            pipes.forEach((p, i) => {
                p.x -= 3;
                if (p.x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                    score++;
                    scoreEl.innerText = score;
                }

                // Столкновения
                if (bird.x + bird.w > p.x && bird.x < p.x + pipeWidth) {
                    if (bird.y < p.top || bird.y + bird.h > p.top + gap) {
                        resetGame();
                    }
                }
            });

            if (bird.y + bird.h > canvas.height || bird.y < 0) resetGame();
            frames++;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBird();
            ctx.fillStyle = "#2ecc71";
            pipes.forEach(p => {
                ctx.fillRect(p.x, 0, pipeWidth, p.top); // Верхняя труба
                ctx.fillRect(p.x, p.top + gap, pipeWidth, p.bottom); // Нижняя труба
            });
        }

        function resetGame() {
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            bird.y = 150;
            bird.velocity = 0;
            pipes = [];
            score = 0;
            scoreEl.innerText = score;
            frames = 0;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        window.addEventListener('touchstart', (e) => {
            bird.velocity = bird.jump;
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        loop();
    </script>
</body>
</html>
